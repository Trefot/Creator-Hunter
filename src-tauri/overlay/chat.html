<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Chat</title>
<style>
@font-face{font-family:Inter;src:url('/assets/alerts/inter-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Inter,system-ui,sans-serif}#chat{display:flex;flex-direction:column;gap:10px;padding:14px;max-width:600px}.message{position:relative;padding:12px 16px;background:linear-gradient(120deg,rgba(39,17,48,.94),rgba(18,12,25,.92));border:1px solid #85532d;border-left:3px solid #e5a64c;border-radius:5px 16px 5px 16px;box-shadow:0 3px 12px #0006;animation:enter .3s ease-out}.message.twitch{border-left-color:#a970ff}.message.youtube{border-left-color:#ff4e45}.head{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:15px;color:#f5c778}.badge{font-size:11px;text-transform:uppercase;color:#dab9ff}.youtube .badge{color:#ff9393}.name{font-weight:800;overflow-wrap:anywhere}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:20px;line-height:1.4}.role{font-size:11px;opacity:.75}@keyframes enter{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.message{animation:none}}
/* Panel de OBS: fondo opaco, historial completo y desplazamiento automático. */
body.panel{background:#120c19;height:100vh;overflow:hidden}body.panel #chat{max-width:none;height:100vh;overflow-y:auto;gap:6px;padding:8px}body.panel .message{padding:7px 10px;border-radius:6px;box-shadow:none;animation:none}body.panel .head{font-size:12px;margin-bottom:2px}body.panel .text{font-size:14px;line-height:1.35}body.panel .time{margin-left:auto;font-size:11px;opacity:.55}.empty{opacity:.6;font-size:13px;padding:10px}
</style></head><body><main id="chat" aria-label="Chat del directo"></main><script>
const params=new URLSearchParams(location.search),p=location.pathname.split('/').pop(),key=params.get('key')||'',preview=params.has('preview'),panel=params.has('panel');
if(panel)document.body.classList.add('panel');
const root=document.getElementById('chat'),firstSeen=new Map();let revision=-1,messages=[];
function time(ms){return ms?new Date(ms).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''}
function draw(){
 const now=Date.now(),stick=root.scrollHeight-root.scrollTop-root.clientHeight<40;
 const visible=(panel?messages.slice(-150):messages.slice(-8)).filter(m=>{if(!firstSeen.has(m.id))firstSeen.set(m.id,m.received_ms||now);return panel||preview||now-firstSeen.get(m.id)<=25000}),ids=new Set(visible.map(m=>m.id));
 for(const node of [...root.children])if(!ids.has(node.dataset.id))node.remove();
 for(const m of visible){if([...root.children].some(n=>n.dataset.id===m.id))continue;
  const row=document.createElement('article');row.dataset.id=m.id;row.className='message '+m.platform;
  const head=document.createElement('div');head.className='head';const badge=document.createElement('span');badge.className='badge';badge.textContent=m.platform==='twitch'?'Twitch':'YouTube';
  const name=document.createElement('span');name.className='name';name.textContent=m.name;head.append(badge,name);
  if(m.broadcaster||m.moderator){const role=document.createElement('span');role.className='role';role.textContent=m.broadcaster?'CREADOR':'MOD';head.append(role)}
  if(panel){const t=document.createElement('span');t.className='time';t.textContent=time(m.received_ms);head.append(t)}
  const text=document.createElement('div');text.className='text';text.textContent=m.text;row.append(head,text);root.append(row);
 }
 if(panel&&!visible.length&&!root.children.length){const e=document.createElement('p');e.className='empty';e.dataset.id='empty';e.textContent='Esperando mensajes de Twitch y YouTube…';root.append(e)}
 if(panel&&stick)root.scrollTop=root.scrollHeight;
}
async function poll(){try{const r=await fetch('/api/chat/'+p+'?key='+encodeURIComponent(key),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();const s=await r.json();if(s.revision!==revision){revision=s.revision;messages=s.messages;const ids=new Set(messages.map(m=>m.id));for(const id of firstSeen.keys())if(!ids.has(id))firstSeen.delete(id);draw()}}catch{}finally{setTimeout(poll,2000)}}
if(preview){const a=p==='all'?['twitch','youtube']:[p,p];messages=[{id:'1',platform:a[0],name:'Trefot',text:'¡Bienvenidos a la comunidad! 🏮',broadcaster:true,received_ms:Date.now()},{id:'2',platform:a[1],name:'LaComunidad',text:'Ese cofre cuenta. ¡Vamos por el siguiente!',received_ms:Date.now()}];draw()}else if(['twitch','youtube','all'].includes(p)&&key){poll();setInterval(draw,1000)}
</script></body></html>
