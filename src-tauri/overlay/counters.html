<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrophyHunter · Contadores</title>
<!-- Tipografía de estilo "gamer"; si OBS no tiene internet se usa Impact. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
<style>
  /* Overlay para la "Fuente de navegador" de OBS: fondo transparente. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: #fff; padding: 14px; }
  #list { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  #list.column { flex-direction: column; }

  .counter {
    --c: #8b5cf6; --bg: rgba(14, 12, 20, 0.85);
    --s: 1; --title: #ffffff; --num: #ffd34d;
    position: relative; animation: enter 400ms ease-out;
  }
  .icon { display: grid; place-items: center; flex-shrink: 0; }
  .icon img { width: 100%; height: 100%; object-fit: contain; }
  .text { display: flex; flex-direction: column; }
  .value { font-variant-numeric: tabular-nums; display: inline-block; }

  /* ── Estilo tarjeta ── */
  .counter.card {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px 12px 14px; border-radius: 18px;
    background: var(--bg); border: 2px solid var(--c);
    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent), 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .card .icon {
    width: calc(58px * var(--s)); height: calc(58px * var(--s)); border-radius: 14px;
    font-size: calc(34px * var(--s)); background: color-mix(in srgb, var(--c) 30%, transparent);
  }
  .card .icon.has-image { background: transparent; width: calc(68px * var(--s)); height: calc(68px * var(--s)); }
  .card .text { line-height: 1.05; }
  .card .name {
    font-size: 17px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--title); -webkit-text-stroke: 0.6px rgba(0, 0, 0, 0.6); paint-order: stroke fill;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
  }
  .card .value { font-size: 46px; font-weight: 800; color: var(--num); text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7); }
  .card .bar { display: none; }

  /* ── Estilo gamer: icono grande, número gigante con contorno y degradado ── */
  .counter.gamer {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 22px 12px 8px; border-radius: 22px;
    background: var(--bg);
  }
  .gamer .icon {
    width: calc(128px * var(--s)); height: calc(128px * var(--s)); font-size: calc(92px * var(--s));
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
  }
  .gamer .text { line-height: 0.9; }
  .gamer .name {
    font-family: "Luckiest Guy", Impact, "Arial Black", sans-serif;
    font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; font-style: italic;
    color: var(--title); -webkit-text-stroke: 3px #120a00; paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.7), 0 0 14px rgba(0, 0, 0, 0.45);
  }
  .gamer .value {
    font-family: "Luckiest Guy", Impact, "Arial Black", sans-serif;
    font-size: 96px; letter-spacing: 0.01em; font-style: italic; transform-origin: 20% 60%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--num) 15%, #fff) 0%, color-mix(in srgb, var(--num) 45%, #fff) 45%, var(--num) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #1a0f00; paint-order: stroke fill;
    filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.55));
  }
  .gamer .bar {
    display: block; height: 6px; width: 70%; margin-top: 4px; border-radius: 99px;
    background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 30%, #fff));
    box-shadow: 0 0 12px var(--c);
  }

  /* ── Animación al sumar ── */
  .bump .value { animation: pop 520ms cubic-bezier(.2, 1.6, .4, 1); }
  .bump .icon { animation: hop 520ms ease-out; }
  .bump::after {
    content: ""; position: absolute; inset: -6px; border-radius: 26px; pointer-events: none;
    box-shadow: 0 0 0 3px var(--c), 0 0 40px 6px var(--c); opacity: 0; animation: flash 600ms ease-out;
  }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.35) rotate(-3deg); } 100% { transform: scale(1); } }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-14px) rotate(-10deg) scale(1.12); } 60% { transform: translateY(2px) rotate(6deg); } }
  @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }

  .spark {
    position: absolute; width: 10px; height: 10px; pointer-events: none;
    background: radial-gradient(circle, #fff 0%, var(--c) 45%, transparent 70%);
    border-radius: 50%; animation: spark 800ms ease-out forwards;
  }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>
<div id="list"></div>
<script>
  // Parámetros: ?c=id1,id2 (qué contadores; vacío = todos), ?layout=row|column
  // y ?preview=1 (vista previa del editor: recibe los datos por postMessage, sin red).
  const params = new URLSearchParams(location.search);
  const only = (params.get("c") || "").split(",").filter(Boolean);
  // Vista previa del editor: con ?preview=1 o incrustado en la app (srcdoc).
  const preview = params.get("preview") === "1" || location.protocol === "about:";
  const list = document.getElementById("list");
  if (params.get("layout") === "column") list.classList.add("column");
  const last = new Map();
  /** Sonidos propios ya decodificados: id → { src, buffer, offset }. */
  const sounds = new Map();
  let audio = null;

  function rgba(hex, opacity) {
    const n = parseInt((hex || "#0e0c14").slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${(opacity ?? 85) / 100})`;
  }

  /** El contexto de audio se crea al cargar (no al sumar), para que el primer sonido no llegue tarde. */
  function ctx() {
    audio ??= new AudioContext({ latencyHint: "interactive" });
    if (audio.state === "suspended") audio.resume().catch(() => {});
    return audio;
  }

  /** Dónde empieza a sonar de verdad: se salta el silencio inicial que traen muchos MP3. */
  function soundStart(buffer) {
    const limit = Math.min(buffer.length, Math.floor(buffer.sampleRate * 1.5));
    for (let i = 0; i < limit; i++) {
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        if (Math.abs(buffer.getChannelData(ch)[i]) > 0.02) return Math.max(0, i - 64) / buffer.sampleRate;
      }
    }
    return 0;
  }

  function soundSrc(c) {
    return c.sound_src || (c.has_sound ? `/api/counters/${c.id}/sound?v=${encodeURIComponent(c.sound_version)}` : null);
  }

  /** Descarga y decodifica el sonido propio en cuanto aparece el contador, antes de que haga falta. */
  function preloadSound(c) {
    const src = soundSrc(c);
    if (!src || sounds.get(c.id)?.src === src) return;
    const entry = { src, buffer: null, offset: 0 };
    sounds.set(c.id, entry);
    fetch(src)
      .then((r) => r.arrayBuffer())
      .then((data) => ctx().decodeAudioData(data))
      .then((buffer) => {
        entry.buffer = buffer;
        entry.offset = soundStart(buffer);
      })
      .catch(() => sounds.delete(c.id));
  }

  /** Sonido por defecto: un arpegio corto y brillante (tipo "cofre abierto"), generado sin archivos. */
  function defaultSound(volume) {
    const ac = ctx();
    const now = ac.currentTime;
    [784, 988, 1319, 1568].forEach((freq, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = i === 3 ? "sine" : "triangle";
      osc.frequency.value = freq;
      const t = now + i * 0.05;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.35 * volume, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (i === 3 ? 0.6 : 0.25));
      osc.connect(gain).connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.7);
    });
  }

  function playSound(c) {
    if (!c.sound_on) return;
    const volume = (c.sound_volume ?? 70) / 100;
    if (!soundSrc(c)) return defaultSound(volume);
    const entry = sounds.get(c.id);
    if (entry?.buffer) {
      const ac = ctx();
      const node = ac.createBufferSource();
      const gain = ac.createGain();
      node.buffer = entry.buffer;
      gain.gain.value = volume;
      node.connect(gain).connect(ac.destination);
      node.start(0, entry.offset);
      return;
    }
    // Aún decodificando (solo en el primer instante): se toca tal cual.
    const a = new Audio(soundSrc(c));
    a.volume = volume;
    a.play().catch(() => {});
  }

  function sparks(el) {
    const value = el.querySelector(".value");
    const box = value.getBoundingClientRect();
    const host = el.getBoundingClientRect();
    for (let i = 0; i < 12; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
      const dist = 50 + Math.random() * 50;
      s.style.left = `${box.left - host.left + box.width / 2}px`;
      s.style.top = `${box.top - host.top + box.height / 2}px`;
      s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
      s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
      el.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
  }

  /** Cuenta del valor viejo al nuevo (rápido si es +1, animado si el salto es grande). */
  function countTo(node, from, to) {
    const fmt = (n) => Math.round(n).toLocaleString("es-MX");
    if (Math.abs(to - from) <= 1) return (node.textContent = fmt(to));
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 450);
      node.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function render(counters) {
    const shown = only.length ? counters.filter((c) => only.includes(c.id)) : counters;
    const ids = new Set(shown.map((c) => c.id));
    for (const el of [...list.children]) if (!ids.has(el.dataset.id)) el.remove();
    shown.forEach((c, i) => {
      let el = list.querySelector(`[data-id="${c.id}"]`);
      if (!el) {
        el = document.createElement("div");
        el.dataset.id = c.id;
        el.innerHTML = '<span class="icon"></span><span class="text"><span class="name"></span><span class="value"></span><span class="bar"></span></span>';
      }
      if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
      el.className = `counter ${c.style === "gamer" ? "gamer" : "card"}`;
      el.style.setProperty("--c", c.color);
      el.style.setProperty("--bg", rgba(c.bg_color, c.bg_opacity));
      el.style.setProperty("--s", String((c.icon_scale ?? 100) / 100));
      el.style.setProperty("--title", c.title_color || "#ffffff");
      el.style.setProperty("--num", c.number_color || "#ffd34d");

      const icon = el.querySelector(".icon");
      const imgSrc = c.image_src || (c.has_image ? `/api/counters/${c.id}/image?v=${encodeURIComponent(c.image_version)}` : null);
      const key = imgSrc ? `img:${imgSrc.length}:${imgSrc.slice(-32)}` : `emoji:${c.icon}`;
      if (icon.dataset.key !== key) {
        icon.dataset.key = key;
        icon.classList.toggle("has-image", !!imgSrc);
        icon.innerHTML = "";
        if (imgSrc) {
          const img = document.createElement("img");
          img.src = imgSrc;
          icon.appendChild(img);
        } else icon.textContent = c.icon;
      }
      el.querySelector(".name").textContent = c.name;
      if (c.sound_on) preloadSound(c);

      const valueNode = el.querySelector(".value");
      const before = last.get(c.id);
      if (before === undefined) valueNode.textContent = c.value.toLocaleString("es-MX");
      else if (before !== c.value) {
        countTo(valueNode, before, c.value);
        if (c.value > before) {
          el.classList.remove("bump");
          void el.offsetWidth; // reinicia la animación
          el.classList.add("bump");
          sparks(el);
          playSound(c);
        }
      }
      last.set(c.id, c.value);
    });
  }

  if (preview) {
    // El editor manda { counters } para pintar y { bump: true } para probar la animación y el sonido.
    let current = [];
    window.addEventListener("message", (e) => {
      if (e.data?.unlockAudio) ctx();
      if (e.data?.counters) {
        current = e.data.counters;
        render(current);
      }
      if (e.data?.bump && current.length) {
        current = current.map((c) => ({ ...c, value: c.value + 1 }));
        render(current);
      }
    });
    parent.postMessage({ overlayReady: true }, "*");
  } else {
    // Espera larga: el servidor responde en cuanto algo cambia, así el número salta al instante.
    let change = -1;
    let appVersion = null;
    ctx(); // en OBS el audio puede arrancar sin clic: se deja listo desde el principio
    async function loop() {
      try {
        const url = change < 0 ? "/api/counters/live" : `/api/counters/live?since=${change}`;
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          change = data.change;
          // La app se actualizó: recarga la página para usar el overlay nuevo (OBS no lo hace solo).
          if (data.app_version) {
            if (appVersion && appVersion !== data.app_version) return location.reload();
            appVersion = data.app_version;
          }
          render(data.counters);
        } else await new Promise((r) => setTimeout(r, 1500));
      } catch (_) {
        await new Promise((r) => setTimeout(r, 1500)); // la app está cerrada: se reintenta
      }
      loop();
    }
    loop();
  }
</script>
</body>
</html>
