<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Nexus · Música</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:18px system-ui,sans-serif}article{display:flex;align-items:center;gap:16px;margin:12px;padding:16px 20px;border:1px solid #996029;border-left:4px solid #e6ad51;border-radius:7px 20px;background:linear-gradient(120deg,#281330f2,#110d18f2);max-width:620px}img{width:72px;height:72px;object-fit:contain}small{display:block;color:#e0b56f;font-size:13px;margin-bottom:4px}strong{display:block;font-size:22px;overflow-wrap:anywhere}p{margin:4px 0;color:#d2bbd8}a{color:inherit;text-decoration:none}progress{width:100%;height:5px;accent-color:#e0b56f}#card[hidden]{display:none}</style></head><body><article id="card" hidden><img id="cover" alt="Portada" hidden><div style="flex:1"><small id="source"></small><a id="link" target="_blank" rel="noopener noreferrer"><strong id="title"></strong></a><p id="artist"></p><progress id="progress" hidden></progress></div></article><audio id="audio"></audio><script>
const q=new URLSearchParams(location.search),key=q.get('key')||'',personal=location.pathname==='/now-playing',preview=q.has('preview'),viewer=crypto.randomUUID(),audio=document.getElementById('audio');let generation=-1,track=null,owner=false,lastGood=0,appVersion=null;
const byId=id=>document.getElementById(id);function display(t,spotify=personal){byId('card').hidden=!t;if(!t)return;byId('title').textContent=t.title||'Música';byId('artist').textContent=t.artists||'';byId('source').textContent=spotify?'Escuchando en Spotify':'Nexus · Música local';let cover;try{const u=new URL(t.cover);if(u.protocol==='https:'&&u.hostname.endsWith('.scdn.co'))cover=u.href}catch{}byId('cover').hidden=!cover;if(cover)byId('cover').src=cover;let link;try{const u=new URL(t.url);if(u.protocol==='https:'&&u.hostname==='open.spotify.com')link=u.href}catch{}byId('link').removeAttribute('href');if(link)byId('link').href=link;byId('progress').hidden=!spotify;if(spotify){byId('progress').max=t.duration_ms||1;byId('progress').value=t.progress_ms||0}}
async function signal(action,g){try{await fetch('/api/music/'+action+'?key='+encodeURIComponent(key)+'&generation='+g,{signal:AbortSignal.timeout(10000)})}catch{}}
async function poll(){try{const r=await fetch('/api/music/state?key='+encodeURIComponent(key)+(personal?'':'&viewer='+encodeURIComponent(viewer)),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();const s=await r.json();lastGood=Date.now();if(s.app_version){if(appVersion&&appVersion!==s.app_version)return location.reload();appVersion=s.app_version}if(personal){display(s.spotify?.playing?s.spotify:null)}else{const t=s.library.find(t=>t.id===s.track);if(s.playing&&t)display(t,false);else display(s.spotify?.playing?s.spotify:null,true);owner=s.audio_owner;audio.volume=Math.max(0,Math.min(1,(s.effective_volume??s.volume??70)/100));if(!owner||!s.playing){audio.pause()}if(s.generation!==generation||s.track!==track){generation=s.generation;track=s.track;audio.pause();audio.removeAttribute('src');if(track){const g=generation;audio.src='/api/music/audio/'+encodeURIComponent(track)+'?key='+encodeURIComponent(key);audio.onended=()=>{if(owner)signal('ended',g)};audio.onerror=()=>{if(owner)signal('failed',g)}}}if(owner&&s.playing&&track&&audio.paused&&!audio.ended){try{await audio.play()}catch{await signal('failed',generation)}}}}catch{audio.pause();display(null)}finally{setTimeout(poll,1500)}}
if(preview){display({title:'Tu música, tu aventura',artists:'Trefot · Nexus Studio',duration_ms:180000,progress_ms:65000})}else if(key){poll();if(!personal)setInterval(()=>{if(Date.now()-lastGood>3500)audio.pause()},500)}
</script></body></html>
