<!doctype html><html lang="es"><meta charset="utf-8"><title>Nexus · Objetivos y platinos</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:18px system-ui,sans-serif;padding:12px}#panel{width:min(680px,100%);background:linear-gradient(130deg,rgba(29,22,48,.94),rgba(14,13,24,.94));border:1px solid #ad79ed;border-radius:18px;padding:20px;box-shadow:0 8px 22px #0005}.top{display:flex;gap:18px;align-items:center}.medal{color:#ffd37a;font-weight:800;font-size:28px}h1{font-size:21px;margin:0 0 4px}small{color:#c9c0dc;font-size:13px}#objective{margin-top:16px;border-top:1px solid #ffffff26;padding-top:14px}h2{margin:6px 0;font-size:24px}#guide{font-size:15px;color:#d7cfe1;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}#progress{margin-top:12px;height:6px;border-radius:8px;background:#ffffff20}#fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#a671e4,#ffd37a);width:0}#error{color:#ffd37a;font-size:12px;margin-top:8px}.done{color:#7ce4a1}
</style><div id="panel"><div class="top"><div id="plat"><div class="medal" id="plat-count">—</div><small id="plat-source"></small></div><div id="game"><h1 id="game-title">Nexus Studio</h1><small id="trophies"></small></div></div><div id="objective"><small>OBJETIVO ACTUAL</small><h2 id="target">Elige un objetivo en Nexus</h2><div id="guide"></div><small id="count"></small><div id="progress"><div id="fill"></div></div></div><div id="error"></div></div><script>
const el=id=>document.getElementById(id);const mode=new URLSearchParams(location.search).get('view');if(mode==='platinums'){el('game').hidden=true;el('objective').hidden=true;}if(mode==='objective')el('plat').hidden=true;
async function tick(){try{const r=await fetch('/api/game/state',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();el('plat-count').textContent=`🏆 ${s.platinos} platinos`;el('plat-source').textContent=`${s.verified} por trofeos · ${s.manual} manuales`;el('game-title').textContent=s.game?.title??'Nexus Studio';el('trophies').textContent=s.game?.trophy_total?`${s.game.trophy_earned}/${s.game.trophy_total} trofeos`:'';el('target').textContent=s.target?(s.target.done?'✓ ':'')+s.target.title:'Elige un objetivo en Nexus';el('target').className=s.target?.done?'done':'';el('guide').textContent=s.target?.guide??'';el('count').textContent=s.total?`${s.done}/${s.total} objetivos conseguidos`:'';el('progress').hidden=!s.total;el('fill').style.width=`${s.total?Math.min(100,s.done/s.total*100):0}%`;el('error').textContent='';}catch{el('error').textContent='Nexus sin conexión · progreso sin actualizar';}setTimeout(tick,1000)}tick();
</script></html>
