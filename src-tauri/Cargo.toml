[package]
name = "studio"
version = "0.2.8"
description = "Creator Studio (nombre de trabajo: TrophyHunter)"
authors = ["TrefotG"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
# Misma versión que usa tauri-plugin-sql: solo para transacciones en las copias de seguridad (D-011).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# TLS nativo de Windows (SChannel): evita compilar aws-lc en C (D-015).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
keyring = { version = "3", features = ["windows-native"] }
# Servidor HTTP local y pequeño para el overlay de OBS y el Stream Deck (D-018).
tiny_http = "0.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
