[package]
name = "studio-data-safety"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../src-tauri/src/data_safety.rs"

[dependencies]
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
