name: Publicar actualización de Windows
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
permissions:
  contents: read
concurrency:
  group: nexus-studio-publicacion
  # Por defecto serializa las publicaciones; la marca permite sustituir un build propio obsoleto.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[replace-pending-build]') }}
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/test-interface
  build:
    needs: interface
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nexus-windows
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            tests/data-safety -> target
            tests/auto-moments -> target
      # El lector solo se recompila cuando cambia su código (ahorra casi un minuto por versión).
      - name: Recuperar lector local de cofres
        id: reader-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/fortnite-reader
          key: fortnite-reader-${{ hashFiles('tools/fortnite-reader/**') }}
      - uses: actions/setup-dotnet@v4
        if: steps.reader-cache.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Compilar lector local de cofres
        if: steps.reader-cache.outputs.cache-hit != 'true'
        run: dotnet publish tools/fortnite-reader/NexusFortniteReader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o src-tauri/resources/fortnite-reader
      - name: Probar arranque del lector local
        shell: pwsh
        run: |
          $stderr = Join-Path $env:RUNNER_TEMP 'nexus-reader-stderr.txt'
          $reader = Start-Process -FilePath ./src-tauri/resources/fortnite-reader/NexusFortniteReader.exe -Wait -PassThru -NoNewWindow -RedirectStandardError $stderr
          $output = Get-Content $stderr -Raw
          if ($reader.ExitCode -ne 1 -or $output -notmatch 'Indica una repetici') { throw "El lector local no inicia correctamente: $output" }
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run tauri -- build --bundles nsis
      - run: npm run release:prepare
      - name: Comprobar actualización y accesos de Windows
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Comprobar integridad del instalador
        shell: bash
        run: cd .release && sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release
          path: .release
          # .release empieza por punto: sin esto upload-artifact lo ignora y la publicación no encuentra nada.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  # Pruebas de Rust en paralelo con la compilación: publicar no espera a hacerlas en fila.
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nexus-windows-tests
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            tests/data-safety -> target
            tests/auto-moments -> target
      - name: Recurso del lector para compilar las pruebas
        shell: pwsh
        run: New-Item -ItemType Directory -Force src-tauri/resources/fortnite-reader | Out-Null; New-Item -ItemType File -Force src-tauri/resources/fortnite-reader/NexusFortniteReader.exe | Out-Null
      - run: cargo test --locked --manifest-path tests/data-safety/Cargo.toml
      - run: cargo test --locked --manifest-path tests/auto-moments/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  publish:
    needs: [build, rust-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: nexus-release
          path: .release
      - uses: actions/checkout@v4
        with:
          ref: releases
          path: .update-channel
          fetch-depth: 1
      - name: Proteger el canal contra versiones anteriores
        run: node scripts/release.mjs check-channel .update-channel/latest.json
      - name: Publicar instalador descargable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./.release/latest.json').version")
          tag="v$version"
          if gh release view "$tag" --json targetCommitish > .release/existing.json 2>/dev/null; then
            target=$(node -p "require('./.release/existing.json').targetCommitish")
            test "$target" = "$GITHUB_SHA" || { echo 'La etiqueta existe para otro origen; no se reemplaza.'; exit 1; }
            gh release upload "$tag" ".release/Nexus-Studio_${version}_x64-setup.exe" .release/TrophyHunter-setup.exe .release/latest.json .release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ".release/Nexus-Studio_${version}_x64-setup.exe" .release/TrophyHunter-setup.exe .release/latest.json .release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Nexus Studio $version" --notes-file .release/NOVEDADES.md
          fi
      - name: Activar la actualización de TrophyHunter existente
        shell: bash
        run: |
          set -euo pipefail
          cp .release/TrophyHunter-setup.exe .release/latest.json .update-channel/
          git -C .update-channel config user.name 'github-actions[bot]'
          git -C .update-channel config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .update-channel add latest.json TrophyHunter-setup.exe
          if ! git -C .update-channel diff --cached --quiet; then
            version=$(node -p "require('./.release/latest.json').version")
            git -C .update-channel commit -m "Nexus Studio $version"
            git -C .update-channel push origin HEAD:releases
          fi
