name: Comprobaciones
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Probar navegación y publicaciones con datos temporales
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          NEXUS_TEST_URL: http://127.0.0.1:1444
          NEXUS_ARTIFACTS: ${{ runner.temp }}/nexus-ui
        run: |
          npm run dev -- --host 127.0.0.1 --port 1444 > "$RUNNER_TEMP/nexus-vite.log" 2>&1 &
          python - <<'PYREADY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:1444'); break
              except Exception:
                  time.sleep(0.5)
          PYREADY
          python tests/integral-044-browser.py
      - run: cargo test --locked --manifest-path tests/data-safety/Cargo.toml
      - run: cargo test --locked --manifest-path tests/obs-protocol/Cargo.toml
      - run: cargo test --locked --manifest-path tests/alerts/Cargo.toml
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar lector local de cofres
        run: dotnet publish tools/fortnite-reader/NexusFortniteReader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o src-tauri/resources/fortnite-reader
      - name: Probar arranque del lector local
        shell: pwsh
        run: |
          $stderr = Join-Path $env:RUNNER_TEMP 'nexus-reader-stderr.txt'
          $reader = Start-Process -FilePath ./src-tauri/resources/fortnite-reader/NexusFortniteReader.exe -Wait -PassThru -NoNewWindow -RedirectStandardError $stderr
          $output = Get-Content $stderr -Raw
          if ($reader.ExitCode -ne 1 -or $output -notmatch 'Indica una repetici') { throw "El lector local no inicia correctamente: $output" }
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --release --manifest-path src-tauri/Cargo.toml
