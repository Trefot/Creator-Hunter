name: Interfaz con datos temporales
description: Verifica navegación y resultados de publicaciones sin cuentas reales
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install playwright==1.56.0
    - shell: bash
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
        NEXUS_TEST_URL: http://127.0.0.1:1444
        NEXUS_ARTIFACTS: ${{ runner.temp }}/nexus-ui
      run: |
        npm run dev -- --host 127.0.0.1 --port 1444 > "$RUNNER_TEMP/nexus-vite.log" 2>&1 &
        python - <<'PYREADY'
        import time,urllib.request
        for attempt in range(30):
            try:
                urllib.request.urlopen('http://127.0.0.1:1444'); break
            except Exception:
                time.sleep(0.5)
        else:
            raise RuntimeError('Nexus no inició el servidor de pruebas')
        PYREADY
        python tests/integral-044-browser.py
        python tests/production-044-browser.py
